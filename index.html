<style>

  .post a { color:#335fd1; font-size:13px; text-decoration:none; }

  .mask.open { display:flex; }
  .modal { width:min(640px, 100%); max-height:84vh; overflow:auto; background:#f7f5f0; border-radius:20px; padding:22px 22px 18px; box-shadow:0 24px 60px rgba(28,27,25,.18); }

  .pill.neg { background:#fbeeee; color:#c4473a; }
  .x { width:32px; height:32px; border:0; border-radius:50%; background:#fff; cursor:pointer; font-size:16px; }
  .sum { margin:16px 0 8px; color:#3f3c37; line-height:1.5; font-size:15px; }
  .tl { margin-top:8px; border-top:1px solid #e6e1d6; }

  .item a { color:#335fd1; font-size:13px; text-decoration:none; } .item p { margin:4px 0 6px; line-height:1.45; }
  footer { color:var(--muted); font-size:12px; margin-top:16px; }
  @media (max-width:980px) { .grid, .split { grid-template-columns:1fr; } h1 { font-size:32px; } .item { grid-template-columns:1fr; } }

];
const themes = ["Memory","Photonics","Neocloud","Materials","CPU"];
const label = {bull:"多頭", bear:"空頭", neut:"中立"};
let mode = "theme", rows = [];
function inRange(d){ if (mode==="theme" || mode==="month") return d >= "2026-09-01"; if (mode==="week") return d >= "2026-09-24"; return d === "2026-09-30"; }
function agg(){
  const map = {};
  POSTS.filter(p => mode==="theme" || inRange(p.date)).forEach(p => p.tags.forEach(t => {
    if (!map[t[0]]) map[t[0]] = {t:t[0], name:t[2], bull:0, bear:0, neut:0, last:p.date, items:[]};
    map[t[0]][t[1]]++; map[t[0]].last = p.date;
    map[t[0]].items.push({date:p.date, id:p.id, stance:t[1], note:t[3]});
  }));
  return Object.values(map).sort((a,b)=>b.items.length-a.items.length || b.bull-a.bull);
}
function cards(){
  const picks = themes.map(th => {
    const map = {};
    POSTS.filter(p => p.theme===th && (mode==="theme" || inRange(p.date))).forEach(p => p.tags.forEach(t => {
      if (t[1]!=="bull") return;
      if (!map[t[0]]) map[t[0]] = {t:t[0], n:0};
      map[t[0]].n++;
    }));
    const hit = Object.values(map).sort((a,b)=>b.n-a.n)[0];
    return hit ? {th, t:hit.t, n:hit.n} : null;
  }).filter(Boolean);
  document.getElementById("cards").innerHTML = picks.map(x => `<article class="card"><div class="who"><div class="av">${x.th.slice(0,1)}</div><div>${x.th}<small>@aleabitoreddit</small></div></div><div class="tick"><b><button class="link" data-t="${x.t}">${x.t}</button></b><span>${x.n} bullish</span></div><div class="meta"><span>這主題最多提及</span><span class="pos">Long</span></div></article>`).join("");
}
function table(){
  document.getElementById("rows").innerHTML = rows.map(r => {
    const n = r.items.length || 1, bp = Math.round(r.bull/n*100), sp = Math.round(r.bear/n*100);
    return `<tr><td class="name"><button class="link" data-t="${r.t}">${r.t}</button><small>${r.name}</small></td><td>${bp}%</td><td><div class="bar"><i style="width:${bp}%;background:#2f8f55"></i><i style="width:${sp}%;background:#c45a4a"></i></div></td><td>${sp}%</td><td><button class="link" data-t="${r.t}">${n}</button></td><td class="pos">${r.bull}</td><td class="neg">${r.bear}</td><td>${r.neut}</td><td>${r.last}</td></tr>`;
  }).join("");
}
function openTicker(t){
  const r = rows.find(x => x.t===t); if (!r) return;
  const lead = r.bull>r.bear ? "整體偏多" : r.bear>r.bull ? "整體偏空" : "多空交錯";
  document.getElementById("modal").innerHTML = `<header><div><div class="kicker">${r.name}</div><h3>${r.t}</h3><div class="pill ${r.bear>r.bull?"neg":""}">${lead} · ${r.items.length} 次</div></div><button class="x" id="close">×</button></header><p class="sum">每次提及一段。先看她當時的判斷，再進原文。</p><div class="tl">` + r.items.slice().reverse().map(item=>`<div class="item"><div><b>${item.date.slice(5)}</b><span>${item.date.slice(0,4)} · ${label[item.stance]}</span></div><div><p>${item.note}</p><a href="https://x.com/aleabitoreddit/status/${item.id}" target="_blank">原文 →</a></div></div>`).join("") + `</div>`;
  document.getElementById("mask").classList.add("open");
  document.getElementById("close").onclick = () => document.getElementById("mask").classList.remove("open");
}
function render(){
  document.getElementById("title").textContent = {theme:"Theme Consensus",day:"Daily Stance",week:"Weekly Stance",month:"Monthly Consensus"}[mode];

  rows = agg(); cards(); table();
  document.querySelectorAll("[data-t]").forEach(el => el.onclick = () => openTicker(el.dataset.t));
}
